<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EmailJS Hello World Test</title>
</head>
<body>
<h1>EmailJS Hello World Test</h1>
<button id="sendBtn">Send Test Email</button>
<p id="message"></p>

<!-- EmailJS SDK v4 for browser (global object) -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
  // Initialize EmailJS with your public key
  emailjs.init("5fFjsmWwmEgEjzfCs");

  document.getElementById("sendBtn").addEventListener("click", function() {
    emailjs.send("service_mi80889", "template_vewvt36", {})
      .then(function(response) {
        document.getElementById("message").innerText = "Email sent successfully!";
        document.getElementById("message").style.color = "green";
        console.log("EmailJS response:", response);
      }, function(error) {
        document.getElementById("message").innerText = "Failed to send email!";
        document.getElementById("message").style.color = "red";
        console.error("EmailJS error:", error);
      });
  });
</script>
</body>
</html>
